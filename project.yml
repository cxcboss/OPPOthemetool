name: OPPOThemeTool
options:
  bundleIdPrefix: com.oppo
  deploymentTarget:
    macOS: "12.0"
  xcodeVersion: "15.0"
  generateEmptyDirectories: true

settings:
  base:
    SWIFT_VERSION: "5.9"
    MACOSX_DEPLOYMENT_TARGET: "12.0"
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: ""
    ARCHS: "x86_64 arm64"
    ONLY_ACTIVE_ARCH: NO

targets:
  OPPOThemeTool:
    type: application
    platform: macOS
    sources:
      - path: OPPOThemeTool/Sources
        type: group
      - path: OPPOThemeTool/Resources/Assets.xcassets
        buildPhase: resources
      - path: OPPOThemeTool/Resources/Info.plist
      - path: OPPOThemeTool/Resources/OPPOThemeTool.entitlements
      - path: OPPOThemeTool/Python/processor.py
    settings:
      base:
        PRODUCT_NAME: OPPO主题打包解包工具
        PRODUCT_BUNDLE_IDENTIFIER: com.oppo.oppothemetool
        INFOPLIST_FILE: OPPOThemeTool/Resources/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        CODE_SIGN_ENTITLEMENTS: OPPOThemeTool/Resources/OPPOThemeTool.entitlements
        LD_RUNPATH_SEARCH_PATHS:
          - $(inherited)
          - "@executable_path/../Frameworks"
        ENABLE_HARDENED_RUNTIME: false
        COMBINE_HIDPI_IMAGES: YES
        ARCHS: "x86_64 arm64"
        ONLY_ACTIVE_ARCH: NO
    entitlements:
      path: OPPOThemeTool/Resources/OPPOThemeTool.entitlements
      properties:
        com.apple.security.app-sandbox: false
